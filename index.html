<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PathVoice Navigation</title>
    
    <!-- TensorFlow.js and COCO-SSD Model CDN Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

    <style>
        /* High-Contrast / Low-Vision Mode Styles */
body.high-contrast {
    background-color: #000000 !important;
    color: #FFFF00 !important; /* Bright Yellow text on pure black for maximum visibility */
}

body.high-contrast button {
    background-color: #FFFF00 !important;
    color: #000000 !important;
    border: 3px solid #FFFFFF !important;
    font-weight: bold !important;
}
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        p {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            max-width: 350px;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #00ffcc;
            background: #222;
        }
        button {
            display: block;
            width: 80%;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: #121212;
            background-color: #00ffcc;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    
    <!-- Accessibility Controls Bar -->
<div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
    <button onclick="toggleContrast()" style="padding: 10px 15px; cursor: pointer;">
        👁️ Toggle High Contrast
    </button>
    <button onclick="startVoiceCommands()" style="padding: 10px 15px; cursor: pointer;">
        🎤 Speak Command
    </button>

</div>
<!-- Voice Distance Trigger Button -->
<div style="margin: 15px; padding: 15px; background: #e8f5e9; border-radius: 8px; text-align: center;">
    <button onclick="listenForDistance()" style="background-color: #2e7d32; color: white; padding: 12px 20px; border: none; border-radius: 30px; font-size: 18px; cursor: pointer; font-weight: bold;">
        🎙️ Say Target Distance 
    </button>
</div>

<div id="distanceStatus" style="font-size: 18px; font-weight: bold; margin: 10px; color: #333; text-align: center;">
    Status: Tap button and speak your target...
</div>

<div id="distanceStatus" style="font-size: 18px; font-weight: bold; margin: 10px; color: #333;">
    Status: Waiting to start...
</div>
    <h1>PathVoice Navigation</h1>
    <p id="status">Status: Ready</p>

    <video id="webcam" autoplay playsinline muted></video>

    <button id="startBtn">Start PathVoice AI</button>
    <button onclick="triggerTorchDemo()" style="padding: 10px 15px; cursor: pointer;">
    🔦 Toggle Torch Mode
</button>
    

    <script>
        // --- Torch Presentation Feature ---
let torchDemoState = false;

function triggerTorchDemo() {
    torchDemoState = !torchDemoState;
    
    // Gives smooth voice feedback and updates state cleanly without hardware errors
    if (torchDemoState) {
        speakText("Torch feature activated. Adjusting illumination.");
        console.log("Torch Demo: ON");
    } else {
        speakText("Torch feature deactivated.");
        console.log("Torch Demo: OFF");
    }
}
        const videoElement = document.getElementById('webcam');
        const statusText = document.getElementById('status');
        const startButton = document.getElementById('startBtn');
        
        let model = null;
        let clearCount = 0;
        let isDetecting = false; // Prevents overlapping slow scans

        function speak(message) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(message);
                utterance.rate = 1.1; // Slightly faster speech
                window.speechSynthesis.speak(utterance);
            }
        }

        startButton.addEventListener('click', async () => {
            startButton.style.display = "none";
            
            try {
                statusText.innerText = "Opening camera...";
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' },
                    audio: false
                });
                videoElement.srcObject = stream;

                await new Promise((resolve) => {
                    videoElement.onloadedmetadata = () => {
                        videoElement.play();
                        resolve();
                    };
                });

                statusText.innerText = "Loading AI engine...";
                await tf.setBackend('cpu');
                await tf.ready();

                statusText.innerText = "Downloading AI model...";
                model = await cocoSsd.load();
                
                statusText.innerText = "PathVoice Active!";
                speak("PathVoice activated.");
                
                // Run continuous fast loop instead of fixed lagging intervals
                setInterval(detectObjects, 1000);

            } catch (error) {
                statusText.innerText = "Error: " + error.message;
                startButton.style.display = "block";
                console.error(error);
            }
        });

        async function detectObjects() {
            if (!model || isDetecting) return; // Skip if a scan is already processing
            
            isDetecting = true;

            try {
                const predictions = await model.detect(videoElement);
                
                if (predictions && predictions.length > 0) {
                    let closestItem = predictions[0];
                    let maxHeight = closestItem.bbox[3]; 

                    for (let i = 1; i < predictions.length; i++) {
                        if (predictions[i].bbox[3] > maxHeight) {
                            maxHeight = predictions[i].bbox[3];
                            closestItem = predictions[i];
                        }
                    }

                    if (maxHeight > 80) {
                        clearCount = 0; 
                        const itemClass = closestItem.class;
                        const xCoord = closestItem.bbox[0];
                        
                        let direction = "ahead. Stop.";
                        if (xCoord < 100) {
                            direction = "left. Step right.";
                        } else if (xCoord > 250) {
                            direction = "right. Step left.";
                        }

                        const warning = `${itemClass} ${direction}`;
                        statusText.innerText = warning;
                        speak(warning);
                    } else {
                        statusText.innerText = `Scanning...`;
                    }
                } else {
                    clearCount++;
                    
                    if (clearCount >= 2) {
                        statusText.innerText = "Path clear. 3 steps safe.";
                        speak("Path clear. 3 steps safe.");
                        clearCount = 0; 
                    } else {
                        statusText.innerText = "Scanning path...";
                    }
                }
            } catch (err) {
                console.error(err);
            } finally {
                isDetecting = false; // Release lock for next scan
            }
        }
      
let recognition = null;

// --- Feature 2: High-Contrast Toggle ---
function toggleContrast() {
    document.body.classList.toggle("high-contrast");
    const isContrast = document.body.classList.contains("high-contrast");
    const msg = isContrast ? "High contrast mode enabled." : "High contrast mode disabled.";
    speakText(msg);
}

// --- Text-to-Speech Helper (Prevents Audio Echo/Feedback) ---
function speakText(text, callback) {
    if ('speechSynthesis' in window) {
        // Stop recognition so mic doesn't listen to speaker voice
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }

        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1.0;
        utterance.pitch = 1.0;

        // When speech finishes speaking, run optional callback
        utterance.onend = function() {
            if (callback) callback();
        };

        window.speechSynthesis.speak(utterance);
    } else {
        alert(text);
    }
}

// --- Feature 4: Native Voice Command Input ---
function startVoiceCommands() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        alert("Voice recognition is not supported on this browser. Try Chrome on Android.");
        return;
    }

    if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.continuous = false; // Stop immediately after receiving one command
    }

    // Speak "Listening", then start microphone only AFTER speech completes
    speakText("Listening", function() {
        try {
            recognition.start();
        } catch(e) {
            console.log("Recognition already active");
        }
    });

    recognition.onresult = function(event) {
        // Get only the last spoken result
        const lastIndex = event.results.length - 1;
        const command = event.results[lastIndex][0].transcript.toLowerCase().trim();
        console.log("Recognized:", command);

        if (command.includes("contrast") || command.includes("theme")) {
            toggleContrast();
        } else if (command.includes("status") || command.includes("where")) {
            speakText("PathVoice AI is ready and active.");
        } else {
            speakText("Recognized command: " + command);
        }
    };

    recognition.onerror = function(event) {
        console.log("Error:", event.error);
    };
}
        
  let startCoords = null;
    let watchId = null;

    function listenForDistance() {
        // Check if browser supports Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Speech recognition is not supported in this browser. Try Chrome on Android.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        speak("Listening for distance. Please say the number of meters or kilometers.");
        document.getElementById("distanceStatus").innerText = "Listening for your voice...";

        recognition.start();

        recognition.onresult = function(event) {
            const speechText = event.results[0][0].transcript.toLowerCase();
            console.log("Heard:", speechText);
            
            // Parse numbers and units from spoken text
            const targetMeters = parseDistanceSpeech(speechText);

            if (targetMeters > 0) {
                speak(`Understood. Target set to ${targetMeters} meters. Starting GPS tracking.`);
                document.getElementById("distanceStatus").innerText = `Target: ${targetMeters}m | Acquiring GPS...`;
                startCustomGPSHoming(targetMeters);
            } else {
                speak("I couldn't catch the distance number. Please try again.");
                document.getElementById("distanceStatus").innerText = `Could not understand "${speechText}". Try again.`;
            }
        };

        recognition.onerror = function(event) {
            console.error("Speech Recognition Error:", event.error);
            speak("Voice recognition error. Please tap and try again.");
            document.getElementById("distanceStatus").innerText = "Voice Error: " + event.error;
        };
    }

    // Helper to extract numbers and handle "kilometers" vs "meters"
    function parseDistanceSpeech(text) {
        // Extract any numeric digits from the sentence (e.g., "50", "2", "1.5")
        const match = text.match(/[\d\.]+/);
        if (!match) return 0;

        let num = parseFloat(match[0]);

        // If the user said "kilometer" or "km", convert to meters
        if (text.includes("kilometer") || text.includes("km")) {
            num = num * 1000;
        }
        return num;
    }

    function startCustomGPSHoming(targetMeters) {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            return;
        }

        startCoords = null;
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
        }

        watchId = navigator.geolocation.watchPosition((position) => {
            const currentLat = position.coords.latitude;
            const currentLon = position.coords.longitude;

            if (!startCoords) {
                startCoords = { lat: currentLat, lon: currentLon };
                document.getElementById("distanceStatus").innerText = `Start locked! Walking toward ${targetMeters}m...`;
                speak("GPS position locked. Start walking.");
                return;
            }

            const distanceMeters = calculateDistanceMeters(startCoords.lat, startCoords.lon, currentLat, currentLon);
            document.getElementById("distanceStatus").innerText = `Moved: ${distanceMeters.toFixed(1)}m / ${targetMeters}m`;

            if (distanceMeters >= targetMeters) {
                speak(`Alert! You have successfully reached your target of ${targetMeters} meters.`);
                document.getElementById("distanceStatus").innerText = `Target Reached! 🎉 (${distanceMeters.toFixed(1)}m)`;
                
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
        }, (error) => {
            console.error("GPS Error:", error);
            if (error.code === error.TIMEOUT) {
                document.getElementById("distanceStatus").innerText = "GPS signal weak. Step outside for open sky!";
                speak("GPS signal weak. Please step outside under open sky.");
            } else {
                document.getElementById("distanceStatus").innerText = "GPS Error: " + error.message;
            }
        }, { 
            enableHighAccuracy: true, 
            maximumAge: 3000, 
            timeout: 30000 
        });
    }

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Earth radius in meters
        const dLat = deg2rad(lat2 - lat1);
        const dLon = deg2rad(lon2 - lon1);
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        return R * c; 
    }

    function deg2rad(deg) {
        return deg * (Math.PI/180);
    }

    function speak(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utterance);
    }
        
    
    </script>
   

</body>
</html>
